system = """
You are a computational lexicographer performing monolingual word sense alignment between lexical resources.

Respond with a single JSON object and nothing else.
"""

[translations]
template = """
Given these Wiktionary sense definitions of the word $lemma ($pos):
<wiktionary_definitions>
$source_definitions
</wiktionary_definitions>

Associate them with the following translation-table glosses:
<translation_table_glosses>
$target_definitions
</translation_table_glosses>

Constraints:
- Base every association on semantic evidence from the supplied definitions and supporting synonyms.
$hierarchy
- Match definitions that express the same lexical sense.
- Allow abbreviated wording and omitted explanatory detail.
- Preserve the referent, participant role, defining purpose, and literal or figurative meaning.
- Associate each Wiktionary sense definition with at most one translation-table gloss.
- Use each translation-table ID at most once.
- Resolve competing translation associations jointly, using null wherever semantic evidence leaves the assignment ambiguous.
- Use null for source definitions with insufficient evidence for any association satisfying these constraints.
- Justify each association in at most 20 words, identifying the shared meaning that distinguishes it from competing senses.

Output:
Return only the following JSON shape, one key per Wiktionary sense definition ID:
{"<wiktionary_id>": null | [{"target_id": "<translation_table_id>", "relation": "translation", "reason": "<=20 words"}]}
Use only the supplied IDs.
"""

[wordnet]
template = """
Given these definitions from Wiktionary for the word $lemma ($pos):
<wiktionary_definitions>
$source_definitions
</wiktionary_definitions>

Associate them with the following WordNet definitions:
<wordnet_definitions>
$target_definitions
</wordnet_definitions>

Relations:
- equivalent: Both definitions describe the same lexical concept.
- wiktionary_narrower: Every instance of the Wiktionary concept belongs to the WordNet concept, with a strict defining restriction.
- wiktionary_broader: Every instance of the WordNet concept belongs to the Wiktionary concept, with a strict defining restriction.

Constraints:
- Base every association on semantic evidence from the supplied definitions and supporting synonyms.
$hierarchy
- Accept associations supported by conceptual equivalence or strict inclusion.
- Distinguish defining restrictions from extra examples and explanatory wording.
- Assign narrower or broader when a defining restriction establishes strict inclusion between the concepts.
- Assign one relation to each accepted pair, directed from Wiktionary toward WordNet.
- Select at most one equivalent association per Wiktionary definition and per synset, choosing the strongest semantic match.
- Evaluate every candidate and retain each supported association satisfying these constraints.
- Use null for source definitions with insufficient evidence for any association satisfying these constraints.
- Write a reason of at most 20 words identifying the decisive shared meaning or the restriction establishing inclusion.

Output:
Return only the following JSON shape, one key per Wiktionary definition ID:
{"<wiktionary_id>": null | [{"target_id": "<synset_id>", "relation": "equivalent|wiktionary_narrower|wiktionary_broader", "reason": "<=20 words"}]}
Use only the supplied synset IDs and the three listed relations.
"""
