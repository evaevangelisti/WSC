dependencies = [
    { name = "en-core-web-sm" },
    { name = "en-core-web-trf" },
    { name = "kwic", extra = ["lemminflect", "stanza"] },
    { name = "openai" },
    { name = "platformdirs" },
    { name = "requests" },
    { name = "tqdm" },
    { name = "typer" },
    { name = "wiktextract" },
]

[package.dev-dependencies]
docs = [
    { name = "myst-parser" },
    { name = "shibuya" },
    { name = "sphinx" },
]
lint = [
    { name = "ruff" },
]
test = [
    { name = "httpx2" },
    { name = "hypothesis" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "responses" },
]
typing = [
    { name = "basedpyright" },
    { name = "types-requests" },
    { name = "types-tqdm" },
]

